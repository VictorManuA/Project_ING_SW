<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- importante no quitar-->
    <link rel="stylesheet" href="styles.css" >
    <link rel="stylesheet" href="styles_menu.css">
    <link rel="stylesheet" href="styles_barraS.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study.Time</title>
    <!-- NO se si los vamos a utilizar pero los voy a dejer-->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
  <header class="barra-superior" data-tauri-drag-region>
    <div class="espacio_botones" data-tauri-drag-region></div>
    <div class="botones_barraS">
        <button class="btn-top">Ajustes</button>
        <button class="btn-top">Proyectos</button>
    </div>

    <div class="espacio-libre" data-tauri-drag-region></div>

  </header>
  <div class="sidebar-trigger-area"></div>
  <nav class="pestañas-laterales">
    <button class="tab-btn active" title="Inicio"><i class="ph ph-house"></i></button>
    <button class="tab-btn" title="Notas"><i class="ph ph-note"></i></button>
    <button class="tab-btn" title="Temporizador"><i class="ph ph-timer"></i></button>
    <button class="tab-btn" title="Perfil"><i class="ph ph-user"></i></button>
</nav>
  <main class="contenido-principal">
    <section id="vista-Inicio" class="vista-app">
      <h2>Inicio</h2>
      <p>Lugar de trabajo de MENU PRINCIPAL</p>
    </section>
    <section id="vista-Notas" class="vista-app oculta">
      <h2>Tus Notas</h2>
      <textarea placeholder="Escribe algo aquí..."></textarea>
      <button id="btn-guardar-nota">Guardar Nota</button>
    </section>
    <section id="vista-Temporizador" class="vista-app oculta">
      <h2>RELOJ</h2>
      <div id="reloj">25:00</div>
      <button id="btn-iniciar-tiempo">Iniciar</button>
    </section>
    <section id="vista-Perfil" class="vista-app oculta">
      <h2>Perfil de Usuario</h2>
      <p>Aquí irán tus estadísticas.</p>
    </section>

  </main>
  </body>
</html>
