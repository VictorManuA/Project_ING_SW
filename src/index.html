<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- importante no quitar-->
    <link rel="stylesheet" href="styles.css" >
    <link rel="stylesheet" href="styles_menu.css">
    <link rel="stylesheet" href="styles_barraS.css">
    <link rel="stylesheet" href="stles_notas.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study.Time</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- NO se si los vamos a utilizar pero los voy a dejer-->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
  <header class="barra-superior" data-tauri-drag-region>
    <div class="espacio_botones" data-tauri-drag-region></div>
    <div class="botones_barraS">
    </div>
    <div class="espacio-libre" data-tauri-drag-region></div>

  </header>
  <div class="sidebar-trigger-area"></div>
  <nav class="pestañas-laterales">
    <button class="tab-btn active" title="Inicio"><i class="ph ph-house"></i></button>
    <button class="tab-btn" title="Notas"><i class="ph ph-note"></i></button>
    <button class="tab-btn" title="Temporizador"><i class="ph ph-timer"></i></button>
    <button class="tab-btn" title="Perfil"><i class="ph ph-user"></i></button>
</nav>
  <main class="contenido-principal">
    <section id="vista-Inicio" class="vista-app">
      <h2>Inicio</h2>
      <p>Lugar de trabajo de MENU PRINCIPAL</p>
    </section>
    <section id="vista-Notas" class="vista-app oculta">
    <div class="contenedor-notas-split">
        <aside class="panel-archivos" id="panel-archivos">
            <div class="header-archivos">
                <h3>Tus Notas</h3>
                <div class="acciones-archivos">
                    <!-- Botón para nueva carpeta -->
                    <button id="btn-nueva-carpeta" title="Nueva Carpeta"><i class="ph ph-folder-plus"></i></button>
                    <!-- Botón para nueva nota -->
                    <button id="btn-nueva-nota" title="Nueva Nota"><i class="ph ph-file-plus"></i></button>
                </div>
            </div>
            
            <!-- Lista dinámica de archivos y carpetas -->
            <ul id="lista-archivos" class="arbol-archivos">
                <!-- Se llenará con JavaScript -->
            </ul>

            <!-- NUEVO: Barra inferior para el Vault -->
            <div class="footer-archivos">
                <button id="btn-crear-vault" class="btn-vault">
                    <i class="ph ph-vault"></i> <span>Abrir / Crear Vault</span>
                </button>
            </div>
        </aside>
        <!-- ESTE ES EL NUEVO DIVISOR -->
        <div class="divisor-redimensionable" id="divisor-notas"></div>

        <!-- Columna Derecha: Editor de Markdown -->
                <!-- Columna Derecha: Editor de Markdown -->
        <div class="panel-editor">
            <div class="editor-herramientas">
                <input type="text" id="nota-titulo" value="Modelo OSI" placeholder="Título de la nota...">
                <div class="herramientas-derecha">
                    <button id="btn-toggle-vista" class="btn-herramienta" title="Alternar Vista"><i class="ph ph-eye"></i> Vista Previa</button>
                    <button id="btn-guardar-nota" class="btn-guardar"><i class="ph ph-floppy-disk"></i> Guardar</button>
                </div>
            </div>
            
            <!-- Contenedor principal de escritura y lectura -->
            <div class="area-trabajo-nota">
                <!-- Área de texto (Modo Edición) -->
                <textarea id="nota-contenido" placeholder="Escribe aquí usando Markdown..."></textarea>
                
                <!-- Área de visualización (Modo Lectura) -->
                <div id="nota-preview" class="markdown-view oculta"></div>
            </div>

            <!-- Barra de estado inferior -->
            <div class="status-bar">
                <span class="ruta-archivo" id="ruta-archivo">
                    <i class="ph ph-folder-open"></i> /Documentos/StudyTime/Notas/Modelo_OSI.md
                </span>
                <span class="contador-palabras" id="contador-palabras">0 palabras</span>
            </div>
        </div>


    </div>
    </section>
    <section id="vista-Temporizador" class="vista-app oculta">
      <h2>RELOJ</h2>
      <div id="reloj">25:00</div>
      <button id="btn-iniciar-tiempo">Iniciar</button>
    </section>
        <section id="vista-Perfil" class="vista-app oculta">
      <div class="contenedor-notas-split"> <!-- Agregué la clase para que se divida igual -->
        
        <!-- Columna Izquierda: Configuración (Sin IDs repetidos) -->
        <aside class="panel-archivos">
            <div class="header-archivos">
                <h3>Configuración</h3>
            </div>
            <div style="padding: 15px;">
                <button title="Ruta para guardar archivos" style="padding: 8px; border-radius: 6px;">Seleccionar Ruta</button>
                <p style="margin-top: 10px; color: #18181b; font-family: monospace;">Ruta: /Documentos/StudyTime</p>
            </div>
        </aside>

        <!-- Divisor (Sin ID repetido) -->
        <div class="divisor-redimensionable"></div>

        <!-- Columna Derecha (Puedes poner opciones aquí después) -->
        <div class="panel-editor">
            <h2>Opciones de Perfil</h2>
        </div>

      </div>
    </section>

  </main>
  </body>
</html>
