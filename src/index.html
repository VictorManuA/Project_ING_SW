<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- importante no quitar-->
    <link rel="stylesheet" href="styles.css" >
    <link rel="stylesheet" href="styles_menu.css">
    <link rel="stylesheet" href="styles_barraS.css">
    <link rel="stylesheet" href="stles_notas.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study.Time</title>
    <script src="./vendor/marked.min.js"></script>
    <script src="./vendor/purify.min.js"></script>
    <!-- NO se si los vamos a utilizar pero los voy a dejer-->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
  <header class="barra-superior" data-tauri-drag-region>
    <div class="espacio_botones" data-tauri-drag-region></div>
    <div class="botones_barraS">
    </div>
    <div class="espacio-libre" data-tauri-drag-region></div>

  </header>
  <div class="sidebar-trigger-area"></div>
  <nav class="pestañas-laterales">
    <button class="tab-btn active" title="Inicio"><i class="ph ph-house"></i></button>
    <button class="tab-btn" title="Notas"><i class="ph ph-note"></i></button>
    <button class="tab-btn" title="Temporizador"><i class="ph ph-timer"></i></button>
    <button class="tab-btn" title="Perfil"><i class="ph ph-user"></i></button>
</nav>
  <main class="contenido-principal">
    <section id="vista-Inicio" class="vista-app">
      <h2>Inicio</h2>
      <p>Lugar de trabajo de MENU PRINCIPAL</p>
    </section>


    <section id="vista-Notas" class="vista-app oculta">
      <div class="contenedor-notas-split">
        <aside class="panel-archivos" id="panel-archivos" data-estado="sin-vault">
          <div class="header-archivos">
            <h3>Tus notas</h3>
            <div class="acciones-archivos">
              <button id="btn-nueva-nota" title="Nueva nota" aria-label="Nueva nota"><i class="ph ph-file-plus"></i></button>
              <button id="btn-nueva-carpeta" title="Nueva carpeta" aria-label="Nueva carpeta"><i class="ph ph-folder-plus"></i></button>
              <button id="btn-refrescar" title="Actualizar desde el disco" aria-label="Actualizar árbol"><i class="ph ph-arrows-clockwise"></i></button>
            </div>
          </div>
          <ul id="lista-archivos" class="arbol-archivos oculta" role="tree" aria-label="Notas y carpetas" tabindex="0"></ul>
          <div id="vault-estado" class="vault-estado">
            <h4 id="vault-estado-titulo"></h4>
            <p id="vault-estado-texto"></p>
            <div id="vault-estado-acciones" class="vault-estado-acciones"></div>
          </div>
          <div class="footer-archivos">
            <div id="menu-vault" class="menu-flotante menu-vault oculta" role="menu"></div>
            <button id="btn-crear-vault" class="btn-vault" aria-haspopup="menu" aria-expanded="false">
              <i class="ph ph-vault"></i>
              <span id="vault-nombre">Elegir carpeta</span>
              <i class="ph ph-caret-up-down"></i>
            </button>
          </div>
        </aside>
        <div class="divisor-redimensionable" id="divisor-notas" role="separator" aria-orientation="vertical" aria-label="Ajustar ancho del panel de notas" tabindex="0"></div>
        <div class="panel-editor" id="panel-editor">
          <div class="editor-vacio" id="editor-vacio">
            <i class="ph ph-note-pencil"></i>
            <p id="editor-vacio-texto"></p>
            <button id="btn-vacio-accion" class="btn-primario oculta" type="button"></button>
          </div>
          <div class="editor-contenido oculta" id="editor-contenido">
            <div class="editor-herramientas">
              <input type="text" id="nota-titulo" placeholder="Título de la nota..." aria-label="Título de la nota" autocomplete="off" spellcheck="false">
            </div>
            <div class="area-trabajo-nota" id="area-trabajo-nota">
              <textarea id="nota-contenido" placeholder="Escribe aquí usando Markdown..." aria-label="Contenido de la nota"></textarea>
              <div id="nota-preview" class="markdown-view" role="region" aria-label="Vista previa"></div>
            </div>
            <div class="status-bar">
              <span class="ruta-archivo" id="ruta-archivo"></span>
              <span class="estado-derecha">
                <span class="estado-guardado" id="estado-guardado" data-estado="guardado" role="status">Guardado</span>
                <span class="contador-palabras" id="contador-palabras">0 palabras</span>
              </span>
            </div>
          </div>
        </div>
      </div>
    </section>





    <section id="vista-Temporizador" class="vista-app oculta">
      <h2>RELOJ</h2>
      <div id="reloj">25:00</div>
      <button id="btn-iniciar-tiempo">Iniciar</button>
    </section>

    <section id="vista-Perfil" class="vista-app oculta">
      <div class="contenedor-notas-split">
        <aside class="panel-archivos">
          <div class="header-archivos">
            <h3>Configuración</h3>
          </div>
          <div class="perfil-config">
            <p class="perfil-etiqueta">Carpeta de notas</p>
            <p id="perfil-ruta" class="perfil-ruta">Sin carpeta seleccionada</p>
            <button id="btn-perfil-ruta" class="btn-secundario" type="button" title="Cambiar la carpeta donde se guardan tus notas">Cambiar carpeta</button>
          </div>
        </aside>
        <div class="divisor-redimensionable"></div>
        <div class="panel-editor">
          <h2>Opciones de Perfil</h2>
        </div>
      </div>
    </section>
  </main>
  </body>
</html>
